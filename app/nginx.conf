# Full nginx config for the Cash On Chain (COC) static SPA — replaces the image default
# (mounted at /etc/nginx/nginx.conf), so it must be complete (events + http).
#
# `user root` lets the worker read the bind-mounted dist/ even when the host forces
# restrictive perms (the SMB workspace writes files 0700). The Cloudflare Tunnel is the only
# public ingress and this is an internal container, so serving as root is acceptable here.
user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;   # symlinked to stderr in nginx:alpine → `docker logs`
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;     # symlinked to stdout in nginx:alpine

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (index-<hash>.js/.css) are content-addressed → cache hard.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA: every other path falls back to index.html so client-side routing (the HashRouter's
    # deep links, /404.html fallback, affiliate links) resolves on a hard refresh.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
